<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdelFlo · 관리자</title>
<style>
  :root{
   --paper:#F5F5F7;
   --paper-deep:#E8E8ED;
   --card:#FFFFFF;
   --ink:#1D1D1F;
   --ink-soft:#6E6E73;
   --line:#D2D2D7;
   --pine:#4F46E5;
   --pine-deep:#312E81;
   --clay:#7C3AED;
   --clay-soft:#C4B5FD;
    --shadow: 0 10px 30px -14px rgba(47,40,25,0.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family: Arial, sans-serif; background:var(--paper); color:var(--ink);
    min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:60px 20px;
  }
  .panel{ width:100%; max-width:720px; }
  h1{ font-family: Arial, sans-serif; color:var(--pine-deep); font-size:26px; margin:0 0 4px; }
  .hint{ color:var(--ink-soft); font-size:13px; margin:0 0 26px; }

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:26px; margin-bottom:18px; box-shadow:0 4px 14px -10px rgba(47,40,25,0.25);
  }
  label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  input[type=password], input[type=text], select, textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px;
    font-size:13.5px; font-family:inherit; background:#fff; color:var(--ink); margin-bottom:16px;
  }
  textarea{ resize:vertical; min-height:70px; }
  button.primary{
    width:100%; padding:12px; border:none; border-radius:9px; background:var(--pine); color:#fff;
    font-weight:600; font-size:14px; cursor:pointer;
  }
  button.primary:hover{ background:var(--pine-deep); }
  button.primary:disabled{ opacity:.5; cursor:not-allowed; }


  .log{ font-size:12px; color:var(--ink-soft); margin-top:10px; white-space:pre-wrap; }
  a.back{ color:var(--clay); font-size:12.5px; text-decoration:none; }

  .new-group-zone{
    border:2px dashed var(--clay); border-radius:14px; padding:22px 20px; text-align:center;
    color:var(--clay); font-size:13.5px; cursor:pointer; margin-bottom:20px; background:rgba(177,113,88,0.06);
  }
  .new-group-zone.drag{ background:rgba(177,113,88,0.14); }
  .new-group-zone strong{ display:block; color:var(--pine-deep); font-size:15px; margin-bottom:4px; }

  .group-card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:20px; margin-bottom:16px; box-shadow:0 4px 14px -10px rgba(47,40,25,0.25);
  }
  .group-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .group-head .badge{
    font-size:11px; font-weight:700; color:#fff; background:var(--pine);
    padding:3px 10px; border-radius:20px;
  }
  .group-head button.remove-group{
    border:none; background:transparent; color:#b04a3a; font-size:12px; cursor:pointer; font-weight:600;
  }
  .row2{ display:flex; gap:12px; }
  .row2 > div{ flex:1; }

  .image-strip{ display:flex; flex-wrap:wrap; gap:10px; margin:14px 0; }
  .image-slot{
    width:120px; border:2px solid transparent; border-radius:10px; padding:6px;
    background:#fff; border-color:var(--line); position:relative;
  }
  .image-slot.main{ border-color:var(--pine); }
  .image-slot img{ width:100%; height:80px; object-fit:cover; border-radius:6px; display:block; margin-bottom:6px; }
  .image-slot .main-tag{
    position:absolute; top:2px; left:2px; background:var(--pine); color:#fff; font-size:9.5px;
    font-weight:700; padding:2px 6px; border-radius:6px;
  }
  .image-slot input{
    width:100%; font-size:11px; padding:5px 6px; margin:0 0 4px; border:1px solid var(--line); border-radius:6px;
  }
  .image-slot .slot-actions{ display:flex; gap:4px; }
  .image-slot .slot-actions button{
    flex:1; font-size:10px; padding:4px; border:none; border-radius:5px; cursor:pointer; background:var(--paper);
  }
  .image-slot .slot-actions button.set-main{ color:var(--pine); font-weight:700; }
  .image-slot .slot-actions button.remove-slot{ color:#b04a3a; }

  .add-more{
    width:120px; height:80px; border:1.5px dashed var(--line); border-radius:10px;
    display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
    font-size:11px; cursor:pointer; text-align:center; padding:6px;
  }
  .add-more:hover{ border-color:var(--clay); color:var(--clay); }

  .group-status{ font-size:12px; margin-top:6px; color:var(--ink-soft); }
  .group-status.ok{ color:var(--pine); font-weight:600; }
  .group-status.err{ color:#b04a3a; font-weight:600; }
</style>
</head>
<body>
<div class="panel">
  <h1>AdelFlo 관리자</h1>
  <p class="hint"><a class="back" href="./index.html">← 갤러리로 돌아가기</a> · <a class="back" href="#" id="logout-link">로그아웃</a></p>

  <div id="app-view">
    <p class="hint" style="margin-top:0;">
      한 번에 끌어다 놓은 사진들은 하나의 묶음(항목)이 됩니다. 첫 번째 사진이 메인 이미지가 되고,
      나머지는 클릭했을 때 보이는 "부가 이미지"로 들어갑니다. 묶음 안에서 사진을 더 추가하거나,
      어떤 사진을 메인으로 할지 바꿀 수 있어요.
    </p>

    <div class="new-group-zone" id="new-group-zone">
      <strong>+ 새 묶음 만들기</strong>
      이미지 1장 이상을 여기로 끌어다 놓으세요 (여러 장을 한 번에 놓으면 한 묶음)
      <input type="file" id="new-group-input" accept="image/*" multiple style="display:none">
    </div>

    <div id="groups"></div>

    <button class="primary" id="upload-all-btn" disabled>전체 업로드</button>
    <div class="log" id="upload-log"></div>
  </div>
</div>

<script>
// Worker 배포 후 아래 주소를 채워주세요. 예: "https://adelflo-api.yourname.workers.dev"
const API_BASE = "https://adelflo-worker.0chorinku0.workers.dev"; // 필수: worker.js를 배포한 주소

const appView = document.getElementById('app-view');
const logoutLink = document.getElementById('logout-link');

const newGroupZone = document.getElementById('new-group-zone');
const newGroupInput = document.getElementById('new-group-input');
const groupsEl = document.getElementById('groups');
const uploadAllBtn = document.getElementById('upload-all-btn');
const uploadLog = document.getElementById('upload-log');

const TAB_OPTIONS = [
  {v:"1", label:"오리지널"}, {v:"2", label:"시초의 세계"}, {v:"3", label:"하드모드"},
  {v:"4", label:"잡탕"}, {v:"5", label:"Friend"}, {v:"6", label:"출처 표기용"},
];

let token = sessionStorage.getItem('adelflo_admin_pw') || "";
let groups = []; // { id, tab, folder, desc, extra, images:[{file,url,extra,previewUrl}], status }
let groupSeq = 0;

// 로그인이 안 되어 있으면 별도 로그인 페이지로 이동
if(!token){
  location.href = './login.html';
}

logoutLink.addEventListener('click', (e)=>{
  e.preventDefault();
  sessionStorage.removeItem('adelflo_admin_pw');
  location.href = './login.html';
});

// ---------- 새 묶음 생성 ----------
['dragenter','dragover'].forEach(evt=>{
  newGroupZone.addEventListener(evt, e=>{ e.preventDefault(); newGroupZone.classList.add('drag'); });
});
['dragleave','drop'].forEach(evt=>{
  newGroupZone.addEventListener(evt, e=>{ e.preventDefault(); newGroupZone.classList.remove('drag'); });
});
newGroupZone.addEventListener('drop', e=> createGroup(e.dataTransfer.files));
newGroupZone.addEventListener('click', ()=> newGroupInput.click());
newGroupInput.addEventListener('change', ()=>{ createGroup(newGroupInput.files); newGroupInput.value = ""; });

function createGroup(fileList){
  const files = [...fileList].filter(f=> f.type.startsWith('image/'));
  if(!files.length) return;
  const id = ++groupSeq;
  groups.push({
    id, tab: "1", folder: "misc", desc: "", extra: "",
    images: files.map(file=> ({ file, extra: "", previewUrl: URL.createObjectURL(file) })),
    status: ""
  });
  renderGroups();
}

function findGroup(id){ return groups.find(g=> g.id === id); }

function renderGroups(){
  groupsEl.innerHTML = "";
  groups.forEach((g, gi)=>{
    const card = document.createElement('div');
    card.className = 'group-card';

    const tabOptionsHTML = TAB_OPTIONS.map(o=>
      `<option value="${o.v}" ${o.v===g.tab?'selected':''}>${o.label}</option>`
    ).join("");

    card.innerHTML = `
      <div class="group-head">
        <span class="badge">묶음 ${gi+1} · 사진 ${g.images.length}장</span>
        <button class="remove-group" data-gid="${g.id}">묶음 삭제</button>
      </div>

      <div class="row2">
        <div>
          <label>등록할 탭</label>
          <select data-gid="${g.id}" data-field="tab">${tabOptionsHTML}</select>
        </div>
        <div>
          <label>저장 폴더 (R2 내부 경로)</label>
          <input type="text" data-gid="${g.id}" data-field="folder" value="${g.folder}" placeholder="예: AF/Original">
        </div>
      </div>

      <label>제목 (메인 이미지 desc)</label>
      <input type="text" data-gid="${g.id}" data-field="desc" value="${g.desc}" placeholder="예: 꼬옥">

      <label>설명 (메인 이미지 extra, 줄바꿈은 &lt;br&gt; 사용)</label>
      <textarea data-gid="${g.id}" data-field="extra" placeholder="예: 커미션 정보 등">${g.extra}</textarea>

      <label>이미지 (첫 번째=메인, 클릭해서 메인 지정 / 삭제 가능)</label>
      <div class="image-strip" data-gid="${g.id}"></div>

      <div class="group-status" data-status-for="${g.id}"></div>
    `;
    groupsEl.appendChild(card);

    const strip = card.querySelector('.image-strip');
    g.images.forEach((img, ii)=>{
      const slot = document.createElement('div');
      slot.className = 'image-slot' + (ii===0 ? ' main' : '');
      slot.innerHTML = `
        ${ii===0 ? '<span class="main-tag">메인</span>' : ''}
        <img src="${img.previewUrl}">
        ${ii===0 ? '' : `<input type="text" placeholder="이 사진 설명" data-gid="${g.id}" data-imgidx="${ii}" value="${img.extra}">`}
        <div class="slot-actions">
          ${ii!==0 ? `<button class="set-main" data-gid="${g.id}" data-imgidx="${ii}">메인으로</button>` : ''}
          <button class="remove-slot" data-gid="${g.id}" data-imgidx="${ii}">삭제</button>
        </div>
      `;
      strip.appendChild(slot);
    });

    const addMore = document.createElement('div');
    addMore.className = 'add-more';
    addMore.textContent = '+ 이미지 추가';
    addMore.addEventListener('click', ()=>{
      const input = document.createElement('input');
      input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
      input.addEventListener('change', ()=>{
        const files = [...input.files].filter(f=> f.type.startsWith('image/'));
        files.forEach(file=> g.images.push({ file, extra:"", previewUrl: URL.createObjectURL(file) }));
        renderGroups();
      });
      input.click();
    });
    strip.appendChild(addMore);
  });

  // 필드 바인딩
  groupsEl.querySelectorAll('[data-field]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const g = findGroup(Number(el.dataset.gid));
      if(g) g[el.dataset.field] = el.value;
    });
  });
  // 개별 이미지 설명
  groupsEl.querySelectorAll('.image-slot input[data-imgidx]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const g = findGroup(Number(el.dataset.gid));
      if(g) g.images[Number(el.dataset.imgidx)].extra = el.value;
    });
  });
  // 메인으로 지정
  groupsEl.querySelectorAll('.set-main').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const g = findGroup(Number(btn.dataset.gid));
      const idx = Number(btn.dataset.imgidx);
      const [picked] = g.images.splice(idx, 1);
      g.images.unshift(picked);
      renderGroups();
    });
  });
  // 이미지 삭제
  groupsEl.querySelectorAll('.remove-slot').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const g = findGroup(Number(btn.dataset.gid));
      const idx = Number(btn.dataset.imgidx);
      g.images.splice(idx, 1);
      if(!g.images.length) groups = groups.filter(x=> x.id !== g.id);
      renderGroups();
    });
  });
  // 묶음 삭제
  groupsEl.querySelectorAll('.remove-group').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      groups = groups.filter(g=> g.id !== Number(btn.dataset.gid));
      renderGroups();
    });
  });

  uploadAllBtn.disabled = groups.length === 0;
}

// ---------- 업로드 ----------
async function uploadFile(file, folder){
  const form = new FormData();
  form.append('file', file);
  form.append('folder', folder);
  const res = await fetch(`${API_BASE}/api/upload-file`, {
    method: 'POST',
    headers: { Authorization: `Bearer ${token}` },
    body: form
  });
  if(res.status === 401) throw new Error("UNAUTHORIZED");
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || '업로드 실패');
  return data.url;
}

uploadAllBtn.addEventListener('click', async ()=>{
  uploadAllBtn.disabled = true;
  uploadLog.textContent = "";

  for(const g of [...groups]){
    const statusEl = groupsEl.querySelector(`[data-status-for="${g.id}"]`);
    statusEl.textContent = "이미지 업로드 중...";
    statusEl.className = 'group-status';
    try{
      const folder = g.folder.trim() || "misc";
      const uploadedUrls = [];
      for(const img of g.images){
        const url = await uploadFile(img.file, folder);
        uploadedUrls.push(url);
      }

      const [mainSrc, ...restSrc] = uploadedUrls;
      const entry = {
        src: mainSrc,
        desc: g.desc,
        extra: g.extra,
      };
      if(restSrc.length){
        entry.extraImages = restSrc.map((src, i)=> ({ src, extra: g.images[i+1].extra }));
      }

      statusEl.textContent = "항목 저장 중...";
      const res = await fetch(`${API_BASE}/api/add-entry`, {
        method: 'POST',
        headers: { 'Content-Type':'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ tab: g.tab, entry })
      });
      if(res.status === 401) throw new Error("UNAUTHORIZED");
      const data = await res.json();
      if(!data.ok) throw new Error(data.error || '저장 실패');

      statusEl.textContent = "완료!";
      statusEl.classList.add('ok');
      groups = groups.filter(x=> x.id !== g.id);
    }catch(e){
      if(e.message === "UNAUTHORIZED"){
        uploadLog.textContent = "로그인이 만료되었습니다. 다시 로그인해주세요.";
        sessionStorage.removeItem('adelflo_admin_pw');
        setTimeout(()=> location.href = './login.html', 1200);
        break;
      }
      statusEl.textContent = "실패: " + e.message;
      statusEl.classList.add('err');
    }
  }
  renderGroups();
  uploadLog.textContent += (uploadLog.textContent ? "\n" : "") + "처리 완료. 갤러리에서 새로고침하면 반영됩니다.";
  uploadAllBtn.disabled = groups.length === 0;
});
</script>
</body>
</html>
